name: quik_cuda
channels:
  - conda-forge
  - defaults

dependencies:
  # Note: QUIK barcode calling requires Singularity/Apptainer container.
  # The pre-built container (oras://quay.io/francoaps/quik-cuda:prebuilt-36bp-v2)
  # is the only supported method for GPU-accelerated QUIK barcode calling.
  # 
  # This conda environment is kept for nf-core compliance but is NOT used
  # for the QUIK process, which runs exclusively in the Singularity container.
  
  # Python utilities for data processing
  - python=3.11
  - biopython
  - numpy
  - pandas
