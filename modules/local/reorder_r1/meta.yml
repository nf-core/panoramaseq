name: reorder_r1_for_starsolo
description: Reorder FASTQ reads from UMI+BC format to BC+UMI format for STARsolo compatibility
keywords:
  - reorder
  - barcode
  - umi
  - starsolo
  - preprocessing
tools:
  - python:
      description: Python programming language for FASTQ reordering
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF-2.0"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - r1:
        type: file
        description: FASTQ file containing UMI followed by barcode
        pattern: "*.fastq.gz"
output:
  - reads:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*_reordered.fastq.gz":
          type: file
          description: Reordered FASTQ with barcode followed by UMI
          pattern: "*_reordered.fastq.gz"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@francoaps"
maintainers:
  - "@francoaps"
